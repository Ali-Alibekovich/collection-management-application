# Local development database.
# Start it with `docker compose up -d`; the server connects to it
# with its default settings (see DatabaseCommunicator).
services:
  postgres:
    image: postgres:16-alpine
    container_name: collection-postgres
    environment:
      POSTGRES_DB: collection
      POSTGRES_USER: collection
      POSTGRES_PASSWORD: collection
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collection -d collection"]
      interval: 5s
      timeout: 3s
      retries: 10

  # the UDP server, containerized: docker compose --profile full up --build
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: collection-server
    profiles: [full]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/collection
      DB_USER: collection
      DB_PASSWORD: collection
    ports:
      - "5555:5555/udp"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
